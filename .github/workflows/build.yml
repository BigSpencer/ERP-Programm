name: Tests & Installer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - name: Tests (SQLite + UI)
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Tests (PostgreSQL)
        run: pytest -q tests/test_services.py
        env:
          ERP_TEST_DATABASE_URL: postgresql+psycopg2://erp:erp@localhost:5432/erp_test

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm packaging/erp_desk.spec
      - name: Windows-Installer (Inno Setup)
        if: runner.os == 'Windows'
        run: iscc packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ERPDesk-${{ runner.os }}
          path: |
            dist/ERPDesk-Setup-*.exe
            dist/ERPDesk/
