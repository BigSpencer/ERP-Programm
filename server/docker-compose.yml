# Zentrale Datenbank für alle ERP-Arbeitsplätze.
# Start:   docker compose up -d
# Danach in jedem Client: Datenbanktyp PostgreSQL, Server = IP/Name dieses Rechners, Port 5432.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD:-bitte-aendern}
      TZ: Europe/Berlin
    ports:
      - "5432:5432"
    volumes:
      - erp-data:/var/lib/postgresql/data

  # Tägliche Sicherung nach ./backup (Aufbewahrung 14 Tage, siehe backup.sh)
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGHOST: db
      PGUSER: erp
      PGPASSWORD: ${ERP_DB_PASSWORD:-bitte-aendern}
    volumes:
      - ./backup:/backup
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  # Smartphone-App für Prüfer (Prüfplanung DGUV V3): http://<IP dieses Rechners>:8080/
  # Passwort ohne Sonderzeichen wie @ : / verwenden (es steht in der Datenbank-URL).
  mobile:
    build:
      context: ..
      dockerfile: server/Dockerfile.mobile
    restart: unless-stopped
    depends_on: [db]
    environment:
      ERP_DATABASE_URL: postgresql+psycopg2://erp:${ERP_DB_PASSWORD:-bitte-aendern}@db:5432/erp
    ports:
      - "8080:8080"

volumes:
  erp-data:
