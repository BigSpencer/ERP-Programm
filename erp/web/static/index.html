<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Premium Deluxe Motorsport ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Manrope:wght@300;400;500;600;700&display=swap">
<link rel="icon" id="favicon" href="/logo?v=LOGOVERSION">
<link rel="apple-touch-icon" href="/logo?v=LOGOVERSION">
<meta name="theme-color" content="#07090f">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="loginCard" novalidate>
    <img class="loginLogo" src="/logo?v=LOGOVERSION" alt="Logo" width="150" height="150">
    <div class="brand big"><b id="loginTop">PREMIUM DELUXE</b><span id="loginSub">MOTORSPORT</span></div>
    <label>Benutzername<input id="lUser" autocomplete="username" autofocus></label>
    <label>Passwort<input id="lPass" type="password" autocomplete="current-password"></label>
    <p class="err" id="lErr" role="alert"></p>
    <button class="btn primary" type="submit" id="lBtn">Anmelden</button>
  </form>
</div>
<div class="app" id="app" hidden>
  <aside class="side">
    <a class="brandRow" href="#cockpit" aria-label="Zum Cockpit"><img class="sideLogo" src="/logo?v=LOGOVERSION" alt="" width="54" height="54">
      <div class="brand"><b id="brandTop">PREMIUM DELUXE</b><span id="brandSub">MOTORSPORT</span></div></a>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>
<script src="/static/app.js"></script>
</body>
</html>
